<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>SkyTrack — Live Airspace</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

:root {
  --bg: #071019;
  --panel: rgba(9, 19, 30, .94);
  --panel2: rgba(15, 28, 42, .94);
  --border: rgba(255,255,255,.10);
  --text: #edf5ff;
  --muted: #8ea1b5;
  --accent: #54b8ff;
  --green: #45e39b;
  --red: #ff6378;
  --yellow: #ffd166;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

#map {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.leaflet-control-attribution {
  background: rgba(0,0,0,.65) !important;
  color: #aaa !important;
}

.leaflet-control-attribution a {
  color: #aaa !important;
}

/* ---------------------------------------------------------
   Top bar
--------------------------------------------------------- */

.topbar {
  position: fixed;
  z-index: 1000;
  top: 14px;
  left: 14px;
  right: 14px;

  display: flex;
  align-items: center;
  gap: 12px;

  padding: 10px 12px;

  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.35);

  backdrop-filter: blur(14px);
}

.logo {
  font-weight: 800;
  letter-spacing: -.02em;
  white-space: nowrap;
}

.logo span {
  color: var(--accent);
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;

  color: var(--muted);
  font-size: 13px;

  flex: 1;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--yellow);

  box-shadow:
    0 0 10px rgba(255,209,102,.65);
}

.status-dot.live {
  background: var(--green);
  box-shadow:
    0 0 10px rgba(69,227,155,.7);
}

.status-dot.error {
  background: var(--red);
  box-shadow:
    0 0 10px rgba(255,99,120,.7);
}

.top-button {
  border: 1px solid var(--border);
  background: rgba(255,255,255,.06);
  color: var(--text);

  border-radius: 9px;
  padding: 8px 11px;

  font-size: 13px;
}

.top-button:hover {
  background: rgba(255,255,255,.11);
}

/* ---------------------------------------------------------
   Side panel
--------------------------------------------------------- */

.panel {
  position: fixed;
  z-index: 1100;

  top: 78px;
  left: 14px;

  width: min(390px, calc(100vw - 28px));
  max-height: calc(100vh - 94px);

  overflow-y: auto;

  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.42);

  backdrop-filter: blur(16px);

  transform: translateX(-120%);
  transition: transform .22s ease;
}

.panel.open {
  transform: translateX(0);
}

.panel-section {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.panel-section:last-child {
  border-bottom: 0;
}

.section-title {
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);

  margin-bottom: 11px;
}

.field {
  margin-bottom: 12px;
}

.field:last-child {
  margin-bottom: 0;
}

.field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.field input,
.field select {
  width: 100%;

  border: 1px solid var(--border);
  border-radius: 9px;

  background: rgba(255,255,255,.055);
  color: var(--text);

  padding: 9px 10px;

  outline: none;
}

.field input:focus,
.field select:focus {
  border-color: rgba(84,184,255,.6);
}

/* ---------------------------------------------------------
   Stats
--------------------------------------------------------- */

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat {
  background: rgba(255,255,255,.045);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px;
}

.stat-value {
  font-size: 20px;
  font-weight: 800;
}

.stat-label {
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

/* ---------------------------------------------------------
   Aircraft list
--------------------------------------------------------- */

.aircraft-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.aircraft-row {
  display: flex;
  align-items: center;
  gap: 9px;

  padding: 9px;

  border-radius: 9px;
  border: 1px solid var(--border);

  background: rgba(255,255,255,.035);

  cursor: pointer;
}

.aircraft-row:hover {
  background: rgba(255,255,255,.08);
}

.aircraft-icon {
  width: 28px;
  height: 28px;

  display: grid;
  place-items: center;

  border-radius: 8px;

  background: rgba(84,184,255,.12);
  color: var(--accent);

  font-size: 14px;
}

.aircraft-main {
  min-width: 0;
  flex: 1;
}

.aircraft-flight {
  font-weight: 750;
  font-size: 13px;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.aircraft-meta {
  color: var(--muted);
  font-size: 11px;
  margin-top: 2px;
}

/* ---------------------------------------------------------
   Data source status
--------------------------------------------------------- */

.source-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 8px;

  padding: 8px 0;

  border-bottom: 1px solid rgba(255,255,255,.055);
}

.source-row:last-child {
  border-bottom: 0;
}

.source-name {
  font-size: 12px;
}

.source-status {
  font-size: 11px;
  color: var(--muted);
  text-align: right;
}

.source-status.ok {
  color: var(--green);
}

.source-status.bad {
  color: var(--red);
}

/* ---------------------------------------------------------
   Bottom info
--------------------------------------------------------- */

.bottom {
  position: fixed;
  z-index: 900;

  left: 50%;
  bottom: 15px;

  transform: translateX(-50%);

  background: rgba(7,16,25,.9);
  border: 1px solid var(--border);

  border-radius: 999px;

  padding: 7px 12px;

  color: var(--muted);
  font-size: 11px;

  backdrop-filter: blur(10px);

  white-space: nowrap;
}

/* ---------------------------------------------------------
   Map aircraft marker
--------------------------------------------------------- */

.plane-marker {
  width: 32px;
  height: 32px;

  display: grid;
  place-items: center;

  color: #fff;

  filter:
    drop-shadow(0 0 5px rgba(84,184,255,.7));

  transform-origin: center;
}

.plane-marker svg {
  width: 28px;
  height: 28px;

  fill: var(--accent);
}

/* ---------------------------------------------------------
   Popup
--------------------------------------------------------- */

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  background: #0c1926;
  color: var(--text);
}

.leaflet-popup-content {
  margin: 13px 15px;
}

.popup-title {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 7px;
}

.popup-line {
  font-size: 12px;
  color: var(--muted);
  margin: 3px 0;
}

.popup-line strong {
  color: var(--text);
}

/* ---------------------------------------------------------
   Mobile
--------------------------------------------------------- */

@media (max-width: 650px) {

  .topbar {
    top: 8px;
    left: 8px;
    right: 8px;
  }

  .logo {
    font-size: 14px;
  }

  .status {
    font-size: 11px;
  }

  .panel {
    top: 67px;
    left: 8px;

    width: calc(100vw - 16px);
    max-height: calc(100vh - 82px);
  }

  .bottom {
    bottom: 8px;
    max-width: calc(100vw - 20px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
}

</style>
</head>

<body>

<div id="map"></div>

<!-- =====================================================
     TOP BAR

<div class="topbar">

  <div class="status">

  </button>

</div>

<!-- =====================================================
     SIDE PANEL
===================================================== -->

<div

>

  <div class="panel-section">

    <div class="section-title">

    </div>

    <div class="stats">

      <div class="stat">
        <div

      </label>

      <input

      <select id="distance">

        <option value="25">

        <option value="75">

        <option value="100">

        <option value="150">

        </option>

        <option value="200">
          200 NM
        </option>

        <option value="250">
          250 NM
        </option>

      </select>

    </div>

    <div class="field">

      <label for="refresh">
        Refresh interval
      </label>

      <select id="refresh">

        <option value="1" selected>
          1 second
        </option>

        <option value="2">
          2 seconds
        </option>

        <option value="5">
          5 seconds
        </option>

        <option value="10">
          10 seconds
        </option>

        <option value="20">

        </option>

        <option value="30">

        </option>

        </option>

    <button

    >

    </button>

  </div>

  <div class="panel-section">

    <div class="section-title">

    </div>

    <div
      id="aircraftList"
      class="aircraft-list"
    >
      <div style="color:var(--muted);font-size:12px">

      </div>

  </div>

  <div class="panel-section">

    <div class="section-title">

    </div>

    <div
      id="sourceList"
    ></div>

  </div>

  <div class="panel-section">

    <div class="section-title">
      Relay
    </div>

    <div
  style="
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
  "
>
  Live aircraft data provided by
  <a
    href="https://avioadsb.org"
    target="_blank"
    rel="noopener noreferrer"
    style="color:var(--accent)"
  >AvioADSB</a>
  (CC BY 4.0).
</div>
  </div>

</div>

<div class="bottom">
  SkyTrack · Live airspace ·
  <span id="lastUpdate">
    waiting for data
  </span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const AVIOADSB_URL =
  "https://avioadsb.org/live/data/aircraft.json";

const DEFAULT_LAT = 48.137;
const DEFAULT_LON = 11.575;
const DEFAULT_DIST = 50;
const DEFAULT_REFRESH = 1;

const SOURCES = [
  "AvioADSB"
];

/* =========================================================
   STATE
========================================================= */

let map;

let aircraftMarkers =
  new Map();

let aircraftData = [];

let loading = false;

let timer = null;

let lastSuccessfulSource =
  null;

let sourceStates = {
  "AvioADSB":
    "waiting"
};

/* =========================================================
   DOM
========================================================= */

const $ =
  id =>
    document.getElementById(id);

const panel =
  $("panel");

const statusText =
  $("statusText");

const statusDot =
  $("statusDot");

const aircraftCount =
  $("aircraftCount");

const sourceValue =
  $("sourceValue");

const sourceList =
  $("sourceList");

const aircraftList =
  $("aircraftList");

const lastUpdate =
  $("lastUpdate");

/* =========================================================
   MAP
========================================================= */

map = L.map("map", {
  zoomControl: true,
  preferCanvas: true
}).setView(
  [DEFAULT_LAT, DEFAULT_LON],
  9
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 18,
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);

/* =========================================================
   AIRCRAFT ICON
========================================================= */

function aircraftIcon(
  track = 0
) {

  return L.divIcon({
    className: "",
    html: `
      <div
        class="plane-marker"
        style="transform:rotate(${Number(track) || 0}deg)"
      >
        <svg
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="
            M21.8 10.6
            13.6 8.1
            13.6 3.2
            12 2
            10.4 3.2
            10.4 8.1
            2.2 10.6
            1.3 12
            2.2 13.4
            10.4 11.9
            10.4 20.2
            7.4 21.8
            7.4 23
            12 21.8
            16.6 23
            16.6 21.8
            13.6 20.2
            13.6 11.9
            21.8 13.4
            22.7 12
            21.8 10.6
          "/>
        </svg>
      </div>
    `,
    iconSize: [
      32,
      32
    ],
    iconAnchor: [
      16,
      16
    ]
  });

}

/* =========================================================
   HELPERS
========================================================= */

function number(value) {

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}

function altitudeText(ac) {

  if (
    ac.alt_baro === "ground"
  ) {
    return "Ground";
  }

  const alt =
    number(ac.alt_baro);

  if (alt == null) {
    return "Altitude unknown";
  }

  return (
    Math.round(alt).toLocaleString() +
    " ft"
  );

}

function speedText(ac) {

  const speed =
    number(ac.gs);

  if (speed == null) {
    return "Speed unknown";
  }

  return (
    Math.round(speed) +
    " kt"
  );

}

function flightName(ac) {

  return (
    ac.flight ||
    ac.callsign ||
    ac.hex ||
    "Unknown"
  ).trim();

}

function aircraftId(ac, index) {

  return (
    ac.hex ||
    ac.icao ||
    ac.registration ||
    `${ac.lat}-${ac.lon}-${index}`
  );

}

/* =========================================================
   STATUS
========================================================= */

function setStatus(
  text,
  state
) {

  statusText.textContent =
    text;

  statusDot.className =
    "status-dot";

  if (state === "live") {
    statusDot.classList.add(
      "live"
    );
  }

  if (state === "error") {
    statusDot.classList.add(
      "error"
    );
  }

}

/* =========================================================
   SOURCE STATUS
========================================================= */

function renderSources() {

  sourceList.innerHTML = "";

  for (
    const name of SOURCES
  ) {

    const state =
      sourceStates[name] ||
      "waiting";

    let label =
      "waiting";

    let cls = "";

    if (state === "ok") {
      label = "connected";
      cls = "ok";
    }

    if (state === "bad") {
      label = "failed";
      cls = "bad";
    }

    if (
      state === "loading"
    ) {
      label = "connecting…";
    }

    sourceList.innerHTML += `
      <div class="source-row">
        <div class="source-name">
          ${name}
        </div>

        <div
          class="source-status ${cls}"
        >
          ${label}
        </div>
      </div>
    `;

  }

}

/* =========================================================
   FETCH
========================================================= */

function distanceNm(
  lat1,
  lon1,
  lat2,
  lon2
) {
  const R = 3440.065;

  const dLat =
    (lat2 - lat1) *
    Math.PI / 180;

  const dLon =
    (lon2 - lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;

  return (
    2 *
    R *
    Math.asin(
      Math.sqrt(a)
    )
  );
}

async function fetchAircraft() {

  /*
   * Do not start another request while
   * the previous request is still running.
   */
  if (loading) {
    return;
  }

  loading = true;

  sourceStates["AvioADSB"] =
    "loading";

  renderSources();

  const lat =
    number(
      $("lat").value
    );

  const lon =
    number(
      $("lon").value
    );

  const dist =
    number(
      $("distance").value
    ) || DEFAULT_DIST;

  /*
   * Validate coordinates.
   */
  if (
    lat == null ||
    lon == null ||
    Math.abs(lat) > 90 ||
    Math.abs(lon) > 180
  ) {

    sourceStates["AvioADSB"] =
      "bad";

    renderSources();

    setStatus(
      "Invalid coordinates",
      "error"
    );

    loading = false;

    return;
  }

  try {

    /*
     * AvioADSB provides a global live snapshot.
     * We filter that snapshot locally to the
     * selected SkyTrack location and radius.
     */
    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        5000
      );

    let response;

    try {

      response =
        await fetch(
          AVIOADSB_URL,
          {
            method: "GET",
            cache: "no-store",
            signal:
              controller.signal
          }
        );

    } finally {

      clearTimeout(
        timeout
      );

    }

    if (!response.ok) {

      throw new Error(
        `AvioADSB HTTP ${response.status}`
      );

    }

    const data =
      await response.json();

    if (
      !data ||
      !Array.isArray(
        data.aircraft
      )
    ) {

      throw new Error(
        "AvioADSB returned no aircraft array"
      );

    }

    /*
     * Convert the global AvioADSB snapshot
     * into the same aircraft array used by
     * the rest of SkyTrack.
     */
    const nearbyAircraft = [];

    for (
      const ac of data.aircraft
    ) {

      const acLat =
        number(ac.lat);

      const acLon =
        number(ac.lon);

      /*
       * Aircraft without a current position
       * cannot be displayed on the map.
       */
      if (
        acLat == null ||
        acLon == null
      ) {
        continue;
      }

      /*
       * Ignore extremely stale positions.
       * AvioADSB reports "seen_pos" in seconds.
       */
      const seenPos =
        number(
          ac.seen_pos
        );

      if (
        seenPos != null &&
        seenPos > 120
      ) {
        continue;
      }

      const distance =
        distanceNm(
          lat,
          lon,
          acLat,
          acLon
        );

      if (
        distance <= dist
      ) {

        nearbyAircraft.push({
          ...ac,

          distance_nm:
            Math.round(
              distance * 10
            ) / 10
        });

      }

    }

    /*
     * IMPORTANT:
     *
     * A successful AvioADSB request with
     * zero aircraft is still a successful
     * request.
     *
     * Therefore we DO replace the current
     * aircraft list with [] in this case.
     */
    aircraftData =
      nearbyAircraft;

    lastSuccessfulSource =
      "AvioADSB";

    sourceStates["AvioADSB"] =
      "ok";

    renderSources();

    /*
     * Update the existing SkyTrack UI.
     * Nothing else in the map/list code
     * needs to know that the data source
     * changed.
     */
    updateMap(
      aircraftData
    );

    updateAircraftList(
      aircraftData
    );

    aircraftCount.textContent =
      aircraftData.length;

    sourceValue.textContent =
      lastSuccessfulSource;

    const now =
      new Date();

    lastUpdate.textContent =
      "updated " +
      now.toLocaleTimeString();

    setStatus(
      `${aircraftData.length} aircraft · AvioADSB`,
      "live"
    );

  } catch (error) {

    /*
     * IMPORTANT:
     *
     * A temporary network failure does NOT
     * delete the aircraft currently displayed.
     *
     * The next 1-second request can recover
     * automatically.
     */
    sourceStates["AvioADSB"] =
      "bad";

    renderSources();

    setStatus(
      error?.name === "AbortError"
        ? "AvioADSB timeout"
        : "AvioADSB connection failed",
      "error"
    );

    /*
     * Keep the existing aircraftData
     * and therefore keep the existing
     * markers on the map.
     */
    lastUpdate.textContent =
      "last update failed";

    console.error(
      "SkyTrack AvioADSB:",
      error
    );

  } finally {

    loading = false;

  }
}

/* =========================================================
   MAP UPDATE
========================================================= */

function updateMap(
  aircraft
) {

  const active =
    new Set();

  aircraft.forEach(
    (ac, index) => {

      const lat =
        number(ac.lat);

      const lon =
        number(ac.lon);

      if (
        lat == null ||
        lon == null
      ) {
        return;
      }

      const id =
        aircraftId(
          ac,
          index
        );

      active.add(id);

      let marker =
        aircraftMarkers.get(id);

      if (!marker) {

        marker =
          L.marker(
            [
              lat,
              lon
            ],
            {
              icon:
                aircraftIcon(
                  ac.track
                ),
              zIndexOffset: 100
            }
          ).addTo(map);

        aircraftMarkers.set(
          id,
          marker
        );

      } else {

        marker.setLatLng(
          [
            lat,
            lon
          ]
        );

        marker.setIcon(
          aircraftIcon(
            ac.track
          )
        );

      }

      marker.bindPopup(
        buildPopup(
          ac
        )
      );

    }
  );

  /*
   * Remove aircraft which disappeared
   * from the current response.
   */

  for (
    const [
      id,
      marker
    ] of aircraftMarkers
  ) {

    if (
      !active.has(id)
    ) {

      map.removeLayer(
        marker
      );

      aircraftMarkers.delete(
        id
      );

    }

  }

}

/* =========================================================
   POPUP
========================================================= */

function buildPopup(
  ac
) {

  const flight =
    flightName(ac);

  const altitude =
    altitudeText(ac);

  const speed =
    speedText(ac);

  const track =
    number(ac.track);

  return `
    <div>
      <div class="popup-title">
        ${escapeHtml(flight)}
      </div>

      <div class="popup-line">
        <strong>ICAO:</strong>
        ${escapeHtml(
          ac.hex || "—"
        )}
      </div>

      <div class="popup-line">
        <strong>Altitude:</strong>
        ${escapeHtml(altitude)}
      </div>

      <div class="popup-line">
        <strong>Speed:</strong>
        ${escapeHtml(speed)}
      </div>

      <div class="popup-line">
        <strong>Heading:</strong>
        ${
          track == null
            ? "—"
            : Math.round(track) +
              "°"
        }
      </div>

      <div class="popup-line">
        <strong>Position:</strong>
        ${
          number(ac.lat)?.toFixed(4)
        },
        ${
          number(ac.lon)?.toFixed(4)
        }
      </div>
    </div>
  `;

}

/* =========================================================
   AIRCRAFT LIST
========================================================= */

function updateAircraftList(
  aircraft
) {

  if (
    !aircraft.length
  ) {

    aircraftList.innerHTML = `
      <div
        style="
          color:var(--muted);
          font-size:12px;
        "
      >
        No aircraft in range.
      </div>
    `;

    return;
  }

  /*
   * Keep the list manageable.
   */

  const sorted =
    [...aircraft]
      .sort(
        (a, b) => {

          const aa =
            number(a.alt_baro);

          const bb =
            number(b.alt_baro);

          return (
            (bb ?? -1) -
            (aa ?? -1)
          );

        }
      )
      .slice(
        0,
        80
      );

  aircraftList.innerHTML =
    "";

  sorted.forEach(
    (ac, index) => {

      const lat =
        number(ac.lat);

      const lon =
        number(ac.lon);

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "aircraft-row";

      row.innerHTML = `
        <div class="aircraft-icon">
          ✈
        </div>

        <div class="aircraft-main">

          <div class="aircraft-flight">
            ${escapeHtml(
              flightName(ac)
            )}
          </div>

          <div class="aircraft-meta">
            ${escapeHtml(
              altitudeText(ac)
            )}
            ·
            ${escapeHtml(
              speedText(ac)
            )}
          </div>

        </div>
      `;

      row.addEventListener(
        "click",
        () => {

          if (
            lat == null ||
            lon == null
          ) {
            return;
          }

          map.flyTo(
            [lat, lon],
            Math.max(
              map.getZoom(),
              11
            ),
            {
              duration: .7
            }
          );

          const id =
            aircraftId(
              ac,
              index
            );

          const marker =
            aircraftMarkers.get(
              id
            );

          if (marker) {
            marker.openPopup();
          }

        }
      );

      aircraftList.appendChild(
        row
      );

    }
  );

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

/* =========================================================
   AUTO REFRESH
========================================================= */

function startRefresh() {

  if (timer) {
    clearInterval(timer);
  }

  const seconds =
    Number(
      $("refresh").value
    ) || DEFAULT_REFRESH;

  timer =
    setInterval(
      fetchAircraft,
      seconds * 1000
    );

}

/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings() {

  localStorage.setItem(
    "skytrack.lat",
    $("lat").value
  );

  localStorage.setItem(
    "skytrack.lon",
    $("lon").value
  );

  localStorage.setItem(
    "skytrack.distance",
    $("distance").value
  );

  localStorage.setItem(
    "skytrack.refresh",
    $("refresh").value
  );

}

/* =========================================================
   LOAD SETTINGS
========================================================= */

function loadSettings() {

  const lat =
    localStorage.getItem(
      "skytrack.lat"
    );

  const lon =
    localStorage.getItem(
      "skytrack.lon"
    );

  const distance =
    localStorage.getItem(
      "skytrack.distance"
    );

  const refresh =
    localStorage.getItem(
      "skytrack.refresh"
    );

  if (lat) {
    $("lat").value =
      lat;
  }

  if (lon) {
    $("lon").value =
      lon;
  }

  if (distance) {
    $("distance").value =
      distance;
  }

  if (
    refresh &&
    [
      "1",
      "2",
      "5",
      "10",
      "20",
      "30",
      "60"
    ].includes(refresh)
  ) {
    $("refresh").value =
      refresh;
  }

}

/* =========================================================
   UI EVENTS
========================================================= */

$("menuButton")
  .addEventListener(
    "click",
    () => {

      panel.classList.toggle(
        "open"
      );

    }
  );

$("refreshButton")
  .addEventListener(
    "click",
    () => {

      fetchAircraft();

    }
  );

$("applyButton")
  .addEventListener(
    "click",
    () => {

      saveSettings();

      /*
       * Center map on new radar position.
       */

      const lat =
        number(
          $("lat").value
        );

      const lon =
        number(
          $("lon").value
        );

      if (
        lat != null &&
        lon != null
      ) {

        map.flyTo(
          [
            lat,
            lon
          ],
          map.getZoom(),
          {
            duration: .5
          }
        );

      }

      startRefresh();

      fetchAircraft();

    }
  );

$("refresh")
  .addEventListener(
    "change",
    () => {

      saveSettings();
      startRefresh();

    }
  );

/* =========================================================
   START
========================================================= */

loadSettings();

renderSources();

const initialLat =
  number(
    $("lat").value
  ) ?? DEFAULT_LAT;

const initialLon =
  number(
    $("lon").value
  ) ?? DEFAULT_LON;

map.setView(
  [
    initialLat,
    initialLon
  ],
  9
);

/*
 * Open panel initially on desktop,
 * closed on small screens.
 */

if (
  window.innerWidth > 700
) {
  panel.classList.add(
    "open"
  );
}

/*
 * First request immediately.
 */

fetchAircraft();

/*
 * Then continue automatically.
 */

startRefresh();

</script>

</body>
