<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070b">
<title>SkyTrack — Live Airspace</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      crossorigin="anonymous"/>

<style>
:root{
  --bg:#05070b;
  --panel:rgba(18,21,28,.88);
  --panel2:rgba(25,29,38,.92);
  --line:rgba(255,255,255,.10);
  --text:#f5f7fb;
  --muted:#8e96a5;
  --blue:#2997ff;
  --green:#32d583;
  --red:#ff5d73;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif}
button,input{font:inherit}
button{border:0;color:inherit}

#map{
  position:absolute;
  inset:0;
  z-index:1;
  background:#080b10;
}

.leaflet-control-attribution{
  background:rgba(5,7,11,.72)!important;
  color:#78808e!important;
  font-size:9px!important;
}
.leaflet-control-attribution a{color:#9ba4b3!important}

.topbar{
  position:absolute;
  z-index:20;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  align-items:center;
  gap:10px;
  pointer-events:none;
}

.brand{
  pointer-events:auto;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  padding:10px 13px;
  border:1px solid var(--line);
  border-radius:17px;
  background:rgba(9,12,17,.82);
  backdrop-filter:blur(22px);
  box-shadow:var(--shadow);
}

.logo{
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:linear-gradient(145deg,#3aa7ff,#146edb);
  box-shadow:0 5px 18px rgba(41,151,255,.35);
  font-size:15px;
}

.brandText{
  font-size:14px;
  font-weight:700;
  letter-spacing:-.2px;
  white-space:nowrap;
}

.liveDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 9px rgba(50,213,131,.8);
  flex:none;
}

.search{
  pointer-events:auto;
  flex:1;
  min-width:90px;
  max-width:460px;
  height:48px;
  border:1px solid var(--line);
  border-radius:16px;
  outline:none;
  color:var(--text);
  background:rgba(9,12,17,.82);
  backdrop-filter:blur(22px);
  padding:0 16px;
  box-shadow:var(--shadow);
}

.search::placeholder{color:#777f8d}

.iconBtn,.modeBtn{
  pointer-events:auto;
  height:44px;
  min-width:44px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(9,12,17,.82);
  backdrop-filter:blur(22px);
  box-shadow:var(--shadow);
  cursor:pointer;
}

.iconBtn:active,.modeBtn:active{transform:scale(.97)}
.modeBtn.active{
  background:rgba(41,151,255,.18);
  border-color:rgba(41,151,255,.45);
  color:#70bcff;
}

.controls{
  position:absolute;
  z-index:20;
  top:82px;
  left:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.glass{
  border:1px solid var(--line);
  background:rgba(9,12,17,.82);
  backdrop-filter:blur(22px);
  box-shadow:var(--shadow);
  border-radius:16px;
}

.controlBtn{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:17px;
}

.stats{
  position:absolute;
  z-index:20;
  left:14px;
  bottom:78px;
  display:flex;
  gap:8px;
  pointer-events:none;
}

.stat{
  min-width:88px;
  padding:9px 11px;
}

.statValue{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
}

.statLabel{
  margin-top:2px;
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.bottom{
  position:absolute;
  z-index:30;
  left:12px;
  right:12px;
  bottom:12px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(9,12,17,.9);
  backdrop-filter:blur(24px);
  box-shadow:var(--shadow);
}

.navBtn{
  height:46px;
  min-width:74px;
  border-radius:14px;
  background:transparent;
  color:#818997;
  cursor:pointer;
  font-size:11px;
}

.navBtn span{
  display:block;
  font-size:17px;
  margin-bottom:2px;
}

.navBtn.active{
  color:#fff;
  background:rgba(255,255,255,.07);
}

.radiusPanel{
  position:absolute;
  z-index:20;
  right:14px;
  bottom:78px;
  width:205px;
  padding:13px 15px;
}

.radiusTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  color:var(--muted);
}

.radiusValue{
  color:#fff;
  font-weight:700;
}

input[type=range]{
  width:100%;
  accent-color:var(--blue);
}

.status{
  position:absolute;
  z-index:25;
  top:74px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(9,12,17,.84);
  backdrop-filter:blur(18px);
  color:#aab2bf;
  font-size:10px;
  white-space:nowrap;
  box-shadow:var(--shadow);
  opacity:0;
  transition:opacity .2s;
  pointer-events:none;
}

.status.show{opacity:1}
.status.error{color:#ff8999}

.air{
  width:26px;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.6));
  transition:transform .2s;
}

.air svg{
  width:24px;
  height:24px;
  fill:#f5f8ff;
  stroke:#05070b;
  stroke-width:1.2;
}

.air.selected svg{
  fill:#56b4ff;
}

.focusCircle{
  stroke:#2997ff;
  stroke-width:1.4;
  stroke-dasharray:5 7;
  fill:#2997ff;
  fill-opacity:.035;
}

.userDot{
  width:15px;
  height:15px;
  border-radius:50%;
  background:#fff;
  border:4px solid #2997ff;
  box-shadow:0 0 0 5px rgba(41,151,255,.18),0 0 20px rgba(41,151,255,.45);
}

.drawer{
  position:absolute;
  z-index:50;
  top:0;
  right:0;
  bottom:0;
  width:min(420px,92vw);
  transform:translateX(105%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);
  background:rgba(9,12,17,.94);
  border-left:1px solid var(--line);
  backdrop-filter:blur(28px);
  box-shadow:-20px 0 60px rgba(0,0,0,.45);
  overflow:auto;
}

.drawer.open{transform:translateX(0)}

.drawerHead{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px;
  background:rgba(9,12,17,.86);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.drawerTitle{
  font-size:17px;
  font-weight:700;
}

.closeBtn{
  width:36px;
  height:36px;
  border-radius:11px;
  background:rgba(255,255,255,.07);
  cursor:pointer;
}

.drawerBody{padding:18px}

.flightHero{
  padding:18px;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
}

.callsign{
  font-size:28px;
  font-weight:800;
  letter-spacing:-1px;
}

.sub{
  color:var(--muted);
  margin-top:4px;
  font-size:13px;
}

.detailGrid{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.detail{
  padding:12px;
  border-radius:13px;
  background:rgba(255,255,255,.045);
}

.detailLabel{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.detailValue{
  margin-top:5px;
  font-size:14px;
  font-weight:650;
}

.action{
  width:100%;
  height:46px;
  margin-top:12px;
  border-radius:14px;
  background:#fff;
  color:#05070b;
  font-weight:700;
  cursor:pointer;
}

.secondary{
  background:rgba(255,255,255,.07);
  color:#fff;
  border:1px solid var(--line);
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.listItem{
  padding:14px;
  border:1px solid var(--line);
  border-radius:15px;
  background:rgba(255,255,255,.035);
  cursor:pointer;
}

.listMain{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.listTitle{font-weight:700}
.listSub{color:var(--muted);font-size:11px;margin-top:4px}

.setting{
  padding:15px 0;
  border-bottom:1px solid var(--line);
}

.setting:last-child{border-bottom:0}

.settingTitle{font-weight:650}
.settingText{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.5}

.toggle{
  float:right;
  width:42px;
  height:25px;
  border-radius:999px;
  background:#333945;
  position:relative;
  cursor:pointer;
}

.toggle:after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#fff;
  transition:.2s;
}

.toggle.on{background:#2997ff}
.toggle.on:after{left:20px}

.locationPicker{
  position:absolute;
  z-index:45;
  inset:0;
  display:none;
  pointer-events:none;
}

.locationPicker.active{display:block}

.crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:34px;
  height:34px;
  transform:translate(-50%,-50%);
}

.crosshair:before,.crosshair:after{
  content:"";
  position:absolute;
  background:#fff;
  box-shadow:0 0 8px #000;
}

.crosshair:before{
  left:16px;
  top:0;
  bottom:0;
  width:2px;
}

.crosshair:after{
  top:16px;
  left:0;
  right:0;
  height:2px;
}

.locationActions{
  position:absolute;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.locationActions button{
  height:44px;
  padding:0 16px;
  border-radius:13px;
  border:1px solid var(--line);
  background:rgba(9,12,17,.9);
  backdrop-filter:blur(18px);
  cursor:pointer;
}

.locationActions .primary{
  background:#fff;
  color:#05070b;
}

.scene3d{
  position:absolute;
  inset:0;
  z-index:5;
  display:none;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,rgba(41,151,255,.10),transparent 36%),
    linear-gradient(#060910,#03050a);
  perspective:900px;
}

.scene3d.active{display:block}

.grid3d{
  position:absolute;
  width:180%;
  height:150%;
  left:-40%;
  top:27%;
  transform-origin:center top;
  transform:rotateX(62deg);
  background-image:
    linear-gradient(rgba(80,120,170,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(80,120,170,.12) 1px,transparent 1px);
  background-size:50px 50px;
  box-shadow:inset 0 80px 100px rgba(0,0,0,.4);
}

.sceneCenter{
  position:absolute;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  width:8px;
  height:8px;
  border-radius:50%;
  background:#2997ff;
  box-shadow:0 0 22px #2997ff;
}

.plane3{
  position:absolute;
  width:24px;
  height:24px;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.7));
}

.plane3 svg{
  width:100%;
  height:100%;
  fill:#fff;
  stroke:#05070b;
  stroke-width:1.2;
}

.empty{
  padding:30px 10px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.hidden{display:none!important}

@media(max-width:700px){
  .brandText{display:none}
  .topbar{gap:7px}
  .search{height:44px}
  .modeBtn{padding:0 10px}
  .stats{bottom:78px}
  .stat{min-width:76px;padding:8px}
  .stat:nth-child(3){display:none}
  .radiusPanel{bottom:140px}
}

@media(min-width:900px){
  .bottom{
    left:50%;
    right:auto;
    width:390px;
    transform:translateX(-50%);
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div id="scene3d" class="scene3d">
  <div class="grid3d"></div>
  <div class="sceneCenter"></div>
</div>

<div class="topbar">
  <div class="brand">
    <div class="logo">✈</div>
    <div class="brandText">SkyTrack</div>
    <div class="liveDot"></div>
  </div>

  <input id="search"
         class="search"
         type="search"
         autocomplete="off"
         placeholder="Search callsign or ICAO…">

  <button id="focusBtn" class="modeBtn active">Focus</button>
  <button id="threeBtn" class="modeBtn">3D</button>
  <button id="refreshBtn" class="iconBtn" title="Refresh">↻</button>
</div>

<div class="controls">
  <button id="locationBtn" class="glass controlBtn" title="Choose location">⌖</button>
  <button id="gpsBtn" class="glass controlBtn" title="Use GPS">◎</button>
</div>

<div id="status" class="status"></div>

<div class="radiusPanel glass">
  <div class="radiusTop">
    <span>Focus radius</span>
    <span id="radiusValue" class="radiusValue">50 km</span>
  </div>
  <input id="radius" type="range" min="10" max="200" step="5" value="50">
</div>

<div class="stats">
  <div class="stat glass">
    <div id="count" class="statValue">—</div>
    <div class="statLabel">Aircraft nearby</div>
  </div>

  <div class="stat glass">
    <div id="nearest" class="statValue">—</div>
    <div class="statLabel">Nearest</div>
  </div>

  <div class="stat glass">
    <div id="updated" class="statValue">—</div>
    <div class="statLabel">Updated</div>
  </div>
</div>

<div class="bottom">
  <button class="navBtn active" data-page="map">
    <span>⌾</span>Map
  </button>
  <button class="navBtn" data-page="bookmarks">
    <span>★</span>Bookmarks
  </button>
  <button class="navBtn" data-page="nearby">
    <span>◉</span>Nearby
  </button>
  <button class="navBtn" data-page="more">
    <span>•••</span>More
  </button>
</div>

<div id="drawer" class="drawer">
  <div class="drawerHead">
    <div id="drawerTitle" class="drawerTitle">SkyTrack</div>
    <button id="closeDrawer" class="closeBtn">×</button>
  </div>
  <div id="drawerBody" class="drawerBody"></div>
</div>

<div id="locationPicker" class="locationPicker">
  <div class="crosshair"></div>

  <div class="locationActions">
    <button id="cancelLocation">Cancel</button>
    <button id="useLocation" class="primary">Use this location</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        crossorigin="anonymous"></script>

<script>
"use strict";

/* =========================================================
   SKYTRACK
   ========================================================= */

const LS_BOOKMARKS = "skytrack.bookmarks.v2";
const LS_LOCATION  = "skytrack.location.v2";

const DEFAULT_LOCATION = {
  lat:48.137,
  lng:11.575,
  name:"Munich"
};

let user = loadLocation();
let radius = 50;
let focusMode = true;
let threeMode = false;

let aircraft = [];
let markers = new Map();
let selectedAircraft = null;
let selectedMarker = null;

let bookmarks = loadBookmarks();
let lastUpdate = null;
let refreshTimer = null;
let searchTimer = null;
let locationPickerActive = false;

const $ = id => document.getElementById(id);

const map = L.map("map",{
  zoomControl:false,
  attributionControl:true,
  preferCanvas:true
}).setView([user.lat,user.lng],9);

L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    attribution:"Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors"
  }
).addTo(map);

L.control.zoom({position:"bottomright"}).addTo(map);

let userMarker = null;
let focusCircle = null;

/* =========================================================
   AIRCRAFT SVG
   ========================================================= */

const PLANE_SVG = `
<svg viewBox="0 0 64 64" aria-hidden="true">
  <path d="M31.8 3.5c2.4 0 3.8 2.1 4.1 5.1l1.3 16.5
  18.3 8.3c1.4.7 2.2 2.2 1.7 3.5-.4 1.4-1.9 2.2-3.3
  1.8l-16.4-3.8 1.6 16.2 7.8 5.2c1.2.8 1.6 2.4.9
  3.6-.7 1.2-2.2 1.7-3.5 1.1l-10.5-4.4-10.5 4.4
  c-1.3.5-2.8.1-3.5-1.1-.7-1.2-.3-2.8.9-3.6l7.8-5.2
  1.6-16.2-16.4 3.8c-1.4.3-2.9-.4-3.3-1.8-.4-1.4.3-2.9
  1.7-3.5l18.3-8.3 1.3-16.5c.2-3 1.7-5.1 4.1-5.1z"/>
</svg>`;

/* =========================================================
   LOCATION
   ========================================================= */

function loadLocation(){
  try{
    const saved = JSON.parse(localStorage.getItem(LS_LOCATION));
    if(saved && Number.isFinite(saved.lat) && Number.isFinite(saved.lng)){
      return saved;
    }
  }catch(e){}
  return {...DEFAULT_LOCATION};
}

function saveLocation(){
  localStorage.setItem(LS_LOCATION,JSON.stringify(user));
}

function updateLocationGraphics(){
  if(userMarker) map.removeLayer(userMarker);
  if(focusCircle) map.removeLayer(focusCircle);

  userMarker = L.marker([user.lat,user.lng],{
    icon:L.divIcon({
      className:"",
      html:'<div class="userDot"></div>',
      iconSize:[15,15],
      iconAnchor:[7.5,7.5]
    }),
    interactive:false
  }).addTo(map);

  focusCircle = L.circle(
    [user.lat,user.lng],
    {
      radius:radius*1000,
      className:"focusCircle",
      interactive:false
    }
  ).addTo(map);
}

function setLocation(lat,lng,name="Custom location"){
  user = {
    lat:Number(lat),
    lng:Number(lng),
    name
  };

  saveLocation();
  updateLocationGraphics();

  map.setView([user.lat,user.lng],9);

  aircraft = [];
  clearAircraftMarkers();

  fetchAircraft();
}

/* =========================================================
   BOOKMARKS
   ========================================================= */

function loadBookmarks(){
  try{
    const x = JSON.parse(localStorage.getItem(LS_BOOKMARKS));
    return Array.isArray(x) ? x : [];
  }catch(e){
    return [];
  }
}

function saveBookmarks(){
  localStorage.setItem(LS_BOOKMARKS,JSON.stringify(bookmarks));
}

function flightId(a){
  return String(
    a.hex ||
    a.icao24 ||
    a.flight ||
    a.r ||
    ""
  ).trim().toUpperCase();
}

function callsign(a){
  return String(a.flight || a.r || "").trim().toUpperCase();
}

function bookmarkAircraft(a){
  const id = flightId(a);
  if(!id) return;

  const existing = bookmarks.find(b => b.id === id);

  if(existing){
    existing.lastSeen = Date.now();
    existing.callsign = callsign(a) || existing.callsign;
    existing.registration = a.r || existing.registration;
    existing.type = a.t || existing.type;
    existing.history = existing.history || [];
  }else{
    bookmarks.push({
      id,
      callsign:callsign(a),
      registration:a.r || "",
      type:a.t || "",
      firstSeen:Date.now(),
      lastSeen:Date.now(),
      history:[]
    });
  }

  saveBookmarks();
}

function isBookmarked(a){
  const id = flightId(a);
  return bookmarks.some(b => b.id === id);
}

function toggleBookmark(a){
  const id = flightId(a);
  const index = bookmarks.findIndex(b => b.id === id);

  if(index >= 0){
    bookmarks.splice(index,1);
  }else{
    bookmarkAircraft(a);
    return;
  }

  saveBookmarks();
}

/* =========================================================
   ADS-B DATA
   ========================================================= */

/*
  GitHub Pages is static hosting. The browser can only use an
  external feed when that feed/proxy allows browser CORS.

  We therefore try several public routes and automatically
  fall back between them.
*/

function directAdsbLol(lat,lng,dist){
  return `https://api.adsb.lol/v2/lat/${lat}/lon/${lng}/dist/${dist}`;
}

function directAdsbFi(lat,lng,dist){
  return `https://opendata.adsb.fi/api/v2/lat/${lat}/lon/${lng}/dist/${dist}`;
}

function directAirplanesLive(lat,lng,dist){
  return `https://api.airplanes.live/v2/point/${lat}/${lng}/${dist}`;
}

function allOrigins(url){
  return "https://api.allorigins.win/raw?url="+encodeURIComponent(url);
}

function codetabs(url){
  return "https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(url);
}

function sourceList(){
  const la=user.lat.toFixed(5);
  const lo=user.lng.toFixed(5);
  const dist=Math.ceil(radius);

  const primary = [
    directAdsbLol(la,lo,dist),
    directAdsbFi(la,lo,dist),
    directAirplanesLive(la,lo,dist)
  ];

  const relays = [
    allOrigins(primary[0]),
    allOrigins(primary[1]),
    allOrigins(primary[2]),
    codetabs(primary[0]),
    codetabs(primary[1])
  ];

  return [...relays,...primary];
}

async function fetchJSON(url,timeout=9000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(),timeout);

  try{
    const response = await fetch(url,{
      method:"GET",
      cache:"no-store",
      mode:"cors",
      headers:{
        "Accept":"application/json"
      },
      signal:controller.signal
    });

    if(!response.ok){
      throw new Error("HTTP "+response.status);
    }

    return await response.json();
  }finally{
    clearTimeout(timer);
  }
}

function normaliseAircraft(json){
  const list = Array.isArray(json?.ac)
    ? json.ac
    : Array.isArray(json?.aircraft)
      ? json.aircraft
      : [];

  return list
    .map(a => ({
      ...a,
      lat:Number(a.lat),
      lon:Number(a.lon),
      hex:String(a.hex || a.icao24 || "").trim().toUpperCase(),
      flight:String(a.flight || a.r || "").trim().toUpperCase()
    }))
    .filter(a =>
      Number.isFinite(a.lat) &&
      Number.isFinite(a.lon) &&
      a.hex
    );
}

async function fetchAircraft(){
  setStatus("Connecting to live feed…");

  const urls = sourceList();
  let found = [];
  let lastError = null;
  let successfulSource = "";

  for(let i=0;i<urls.length;i++){
    try{
      const json = await fetchJSON(urls[i]);

      if(!json || typeof json !== "object"){
        throw new Error("Invalid JSON");
      }

      const result = normaliseAircraft(json);

      /*
        An empty result is valid, but keep trying the other
        sources because a different provider may have data.
      */
      if(result.length){
        found = result;
        successfulSource = urls[i];
        break;
      }

      if(!successfulSource){
        successfulSource = urls[i];
      }
    }catch(err){
      lastError = err;
    }
  }

  if(!found.length){
    aircraft = [];
    redraw();

    setStatus(
      "No live aircraft feed reachable",
      true
    );

    $("count").textContent="0";
    $("nearest").textContent="—";
    $("updated").textContent="—";

    return;
  }

  aircraft = dedupeAircraft(found);

  lastUpdate = Date.now();

  redraw();
  updateStats();

  const sourceName =
    successfulSource.includes("allorigins") ? "relay" :
    successfulSource.includes("codetabs") ? "relay" :
    successfulSource.includes("adsb.lol") ? "ADSB.lol" :
    successfulSource.includes("adsb.fi") ? "adsb.fi" :
    successfulSource.includes("airplanes.live") ? "Airplanes.live" :
    "live feed";

  setStatus(
    `${aircraft.length} aircraft · ${sourceName}`
  );

  setTimeout(()=>setStatus("",false),2500);

  syncBookmarks();
}

function dedupeAircraft(list){
  const map = new Map();

  for(const a of list){
    const id = flightId(a);
    if(!id) continue;

    const existing = map.get(id);

    if(!existing){
      map.set(id,a);
    }else{
      map.set(id,{
        ...existing,
        ...a
      });
    }
  }

  return [...map.values()];
}

/* =========================================================
   AIRCRAFT HELPERS
   ========================================================= */

function altNum(value){
  if(value === null || value === undefined) return 0;
  if(String(value).toLowerCase()==="ground") return 0;

  const n=Number(value);
  return Number.isFinite(n) ? n : 0;
}

function speedNum(a){
  const n=Number(a.gs);
  return Number.isFinite(n) ? n : 0;
}

function headingNum(a){
  const n=Number(a.track ?? a.t ?? 0);
  return Number.isFinite(n) ? n : 0;
}

function distanceKm(a){
  const lat1=user.lat*Math.PI/180;
  const lat2=a.lat*Math.PI/180;
  const dLat=(a.lat-user.lat)*Math.PI/180;
  const dLon=(a.lon-user.lng)*Math.PI/180;

  const h=
    Math.sin(dLat/2)**2+
    Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;

  return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

function airlineFromCall(cs){
  const prefix=String(cs||"").slice(0,3);

  const airlines={
    DLH:"Lufthansa",
    EWG:"Eurowings",
    OAL:"Olympic",
    RYR:"Ryanair",
    EZY:"easyJet",
    SWR:"Swiss",
    AUA:"Austrian",
    KLM:"KLM",
    AFR:"Air France",
    BAW:"British Airways",
    SAS:"SAS",
    UAL:"United",
    DAL:"Delta",
    AAL:"American",
    UAE:"Emirates",
    QTR:"Qatar Airways",
    THY:"Turkish Airlines",
    WZZ:"Wizz Air",
    FIN:"Finnair",
    TAP:"TAP Air Portugal",
    IBE:"Iberia",
    VLG:"Vueling"
  };

  return airlines[prefix] || "";
}

function formatAlt(a){
  const alt=altNum(a.alt_baro);

  if(!alt) return "Ground";

  return Math.round(alt/100)*100
    .toLocaleString("en-US")+" ft";
}

function formatSpeed(a){
  const speed=speedNum(a);

  if(!speed) return "—";

  return Math.round(speed*1.852)+" km/h";
}

function formatHeading(a){
  const h=headingNum(a);

  if(!h) return "—";

  return Math.round(h)+"°";
}

/* =========================================================
   MAP RENDERING
   ========================================================= */

function clearAircraftMarkers(){
  markers.forEach(marker=>map.removeLayer(marker));
  markers.clear();
}

function visibleAircraft(){
  if(!focusMode) return aircraft;

  return aircraft.filter(a=>{
    return distanceKm(a)<=radius;
  });
}

function redraw(){
  clearAircraftMarkers();

  updateLocationGraphics();

  const list=visibleAircraft();

  list.forEach(a=>{
    const heading=headingNum(a);

    const icon=L.divIcon({
      className:"",
      html:`
        <div class="air ${selectedAircraft && flightId(selectedAircraft)===flightId(a) ? "selected":""}"
             style="transform:rotate(${heading}deg)">
          ${PLANE_SVG}
        </div>`,
      iconSize:[26,26],
      iconAnchor:[13,13]
    });

    const marker=L.marker([a.lat,a.lon],{
      icon,
      riseOnHover:true
    }).addTo(map);

    marker.on("click",()=>showFlight(a));

    markers.set(flightId(a),marker);
  });

  render3D(list);
}

function updateStats(){
  const list=visibleAircraft();

  $("count").textContent=list.length;

  if(!list.length){
    $("nearest").textContent="—";
  }else{
    const nearest=list
      .map(a=>({a,d:distanceKm(a)}))
      .sort((x,y)=>x.d-y.d)[0];

    $("nearest").textContent=
      nearest.d<10
        ? nearest.d.toFixed(1)+" km"
        : Math.round(nearest.d)+" km";
  }

  if(lastUpdate){
    $("updated").textContent=
      new Date(lastUpdate).toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      });
  }
}

/* =========================================================
   3D
   ========================================================= */

function render3D(list){
  const scene=$("scene3d");

  scene.querySelectorAll(".plane3").forEach(e=>e.remove());

  if(!threeMode) return;

  const span=(focusMode?radius:150)*2.15;

  list.slice(0,150).forEach(a=>{
    const dx=
      (a.lon-user.lng)*
      Math.cos(user.lat*Math.PI/180)*
      111;

    const dy=(a.lat-user.lat)*111;

    let x=50+(dx/span)*100;
    let y=58-(dy/span)*100;

    x=Math.max(-10,Math.min(110,x));
    y=Math.max(8,Math.min(92,y));

    const altitude=altNum(a.alt_baro);

    const z=Math.min(300,altitude/35);

    const el=document.createElement("div");
    el.className="plane3";

    el.innerHTML=PLANE_SVG;

    el.style.left=x+"%";
    el.style.top=(y-z*.16)+"%";
    el.style.transform=
      `translate(-50%,-50%) rotate(${headingNum(a)}deg)`;

    el.title=callsign(a)||flightId(a);

    el.addEventListener("click",()=>{
      showFlight(a);
    });

    scene.appendChild(el);
  });
}

/* =========================================================
   FLIGHT DETAILS
   ========================================================= */

function showFlight(a){
  selectedAircraft=a;

  $("drawerTitle").textContent=
    callsign(a)||flightId(a)||"Aircraft";

  const airline=airlineFromCall(callsign(a));

  $("drawerBody").innerHTML=`
    <div class="flightHero">
      <div class="callsign">
        ${escapeHtml(callsign(a)||flightId(a)||"Unknown")}
      </div>

      <div class="sub">
        ${escapeHtml(
          [airline,a.t,a.r]
          .filter(Boolean)
          .join(" · ") || "Aircraft"
        )}
      </div>

      <div class="detailGrid">
        <div class="detail">
          <div class="detailLabel">Altitude</div>
          <div class="detailValue">${formatAlt(a)}</div>
        </div>

        <div class="detail">
          <div class="detailLabel">Speed</div>
          <div class="detailValue">${formatSpeed(a)}</div>
        </div>

        <div class="detail">
          <div class="detailLabel">Heading</div>
          <div class="detailValue">${formatHeading(a)}</div>
        </div>

        <div class="detail">
          <div class="detailLabel">Distance</div>
          <div class="detailValue">${distanceKm(a).toFixed(1)} km</div>
        </div>

        <div class="detail">
          <div class="detailLabel">ICAO</div>
          <div class="detailValue">${escapeHtml(flightId(a))}</div>
        </div>

        <div class="detail">
          <div class="detailLabel">Position</div>
          <div class="detailValue">
            ${a.lat.toFixed(3)}, ${a.lon.toFixed(3)}
          </div>
        </div>
      </div>

      <button id="bookmarkCurrent" class="action">
        ${isBookmarked(a) ? "★ Remove bookmark" : "☆ Bookmark aircraft"}
      </button>

      <button id="centerCurrent" class="action secondary">
        Center on aircraft
      </button>
    </div>
  `;

  $("drawer").classList.add("open");

  $("bookmarkCurrent").onclick=()=>{
    toggleBookmark(a);
    showFlight(a);
  };

  $("centerCurrent").onclick=()=>{
    map.setView([a.lat,a.lon],11);
    closeDrawer();
  };

  redraw();
}

function closeDrawer(){
  $("drawer").classList.remove("open");
}

/* =========================================================
   SEARCH
   ========================================================= */

$("search").addEventListener("input",()=>{
  clearTimeout(searchTimer);

  searchTimer=setTimeout(()=>{
    const q=$("search").value.trim().toUpperCase();

    if(!q){
      redraw();
      return;
    }

    const match=aircraft.find(a=>
      flightId(a).includes(q) ||
      callsign(a).includes(q) ||
      String(a.r||"").toUpperCase().includes(q)
    );

    if(match){
      map.setView([match.lat,match.lon],11);
      showFlight(match);
    }
  },250);
});

$("search").addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const q=$("search").value.trim().toUpperCase();

    const match=aircraft.find(a=>
      flightId(a).includes(q) ||
      callsign(a).includes(q) ||
      String(a.r||"").toUpperCase().includes(q)
    );

    if(match) showFlight(match);
  }
});

   FOCUS / RADIUS
   ========================================================= */

$("focusBtn").onclick=()=>{
  focusMode=!focusMode;

  $("focusBtn").classList.toggle("active",focusMode);

  redraw();
  updateStats();
};

$("radius").addEventListener("input",()=>{

  updateLocationGraphics();
  redraw();
  updateStats();
});

$("radius").addEventListener("change",()=>{

  radiusFetchTimer=setTimeout(()=>{
    fetchAircraft();
  },300);

/* =========================================================
   3D TOGGLE
   ========================================================= */

$("threeBtn").onclick=()=>{
  threeMode=!threeMode;

  $("threeBtn").classList.toggle("active",threeMode);
  $("map").style.display=threeMode?"none":"block";
  $("scene3d").classList.toggle("active",threeMode);

  if(threeMode){
    $("radiusPanel").style.display="none";
    render3D(visibleAircraft());
  }else{
    $("radiusPanel").style.display="block";
  }
};

/* =========================================================
   REFRESH
   ========================================================= */

$("refreshBtn").onclick=()=>{
  fetchAircraft();
};

/* =========================================================
   GPS
   ========================================================= */

$("gpsBtn").onclick=()=>{
  if(!navigator.geolocation){
    setStatus("Geolocation is not supported",true);
    return;
  }

  setStatus("Getting your location…");

  navigator.geolocation.getCurrentPosition(
    position=>{
      setLocation(
        position.coords.latitude,
        position.coords.longitude,
        "Current location"
      );

      setStatus("Location updated");
      setTimeout(()=>setStatus(""),1800);
    },
    error=>{
      setStatus(
        error.code===1
          ? "Location permission denied"
          : "Unable to get your location",
        true
      );
    },
    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:60000
    }
  );
};

/* =========================================================
   LOCATION PICKER
   ========================================================= */

function openLocationPicker(){
  locationPickerActive=true;
  $("locationPicker").classList.add("active");
  $("locationPicker").dataset.lat=user.lat;
  $("locationPicker").dataset.lng=user.lng;

  map.dragging.enable();
}

function closeLocationPicker(){
  locationPickerActive=false;
  $("locationPicker").classList.remove("active");
}

$("locationBtn").onclick=()=>{
  openLocationPicker();
};

$("cancelLocation").onclick=()=>{
  closeLocationPicker();
};

$("useLocation").onclick=()=>{
  const center=map.getCenter();

  setLocation(
    center.lat,
    center.lng,

  );

  closeLocationPicker();
};

/* =========================================================
   DRAWER / NAV
   ========================================================= */

$("closeDrawer").onclick=closeDrawer;

document.querySelectorAll(".navBtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".navBtn")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    const page=btn.dataset.page;

    if(page==="map"){
      closeDrawer();
      return;
    }

    if(page==="bookmarks"){
      showBookmarks();
      return;
    }

    if(page==="nearby"){
      showNearby();
      return;
    }

    if(page==="more"){
      showMore();
    }
  });
});

function showBookmarks(){
  $("drawerTitle").textContent="Bookmarks";

  if(!bookmarks.length){
    $("drawerBody").innerHTML=`
      <div class="empty">
        No bookmarked aircraft yet.<br><br>
        Open an aircraft and tap “Bookmark aircraft”.
      </div>
    `;
  }else{
    $("drawerBody").innerHTML=`
      <div class="list">
        ${bookmarks.map((b,i)=>`
          <div class="listItem" data-bookmark="${i}">
            <div class="listMain">
              <div>
                <div class="listTitle">
                  ${escapeHtml(b.callsign||b.id)}
                </div>
                <div class="listSub">
                  ${escapeHtml(
                    [b.registration,b.type]
                    .filter(Boolean)
                    .join(" · ") || b.id
                  )}
                </div>
              </div>
              <div>★</div>
            </div>
          </div>
        `).join("")}
      </div>
    `;

    $("drawerBody")
      .querySelectorAll("[data-bookmark]")
      .forEach(el=>{
        el.onclick=()=>{
          const b=bookmarks[Number(el.dataset.bookmark)];

          const a=aircraft.find(x=>
            flightId(x)===b.id ||
            callsign(x)===b.callsign
          );

          if(a){
            showFlight(a);
          }else{
            setStatus("Aircraft is not currently nearby",true);
          }
        };
      });
  }

  $("drawer").classList.add("open");
}

function showNearby(){
  const list=visibleAircraft()
    .map(a=>({
      a,
      d:distanceKm(a)
    }))
    .sort((x,y)=>x.d-y.d)
    .slice(0,40);

  $("drawerTitle").textContent="Nearby";

  if(!list.length){
    $("drawerBody").innerHTML=`
      <div class="empty">
        No aircraft are currently available in the selected area.
      </div>
    `;
  }else{
    $("drawerBody").innerHTML=`
      <div class="list">
        ${list.map((x,i)=>`
          <div class="listItem" data-nearby="${i}">
            <div class="listMain">
              <div>
                <div class="listTitle">
                  ${escapeHtml(
                    callsign(x.a)||flightId(x.a)
                  )}
                </div>
                <div class="listSub">
                  ${escapeHtml(
                    [
                      airlineFromCall(callsign(x.a)),
                      formatAlt(x.a)
                    ].filter(Boolean).join(" · ")
                  )}
                </div>
              </div>

              <div>
                ${x.d<10
                  ? x.d.toFixed(1)
                  : Math.round(x.d)} km
              </div>
            </div>
          </div>
        `).join("")}
      </div>
    `;

    $("drawerBody")
      .querySelectorAll("[data-nearby]")
      .forEach(el=>{
        el.onclick=()=>{
          const x=list[Number(el.dataset.nearby)];
          showFlight(x.a);
          map.setView([x.a.lat,x.a.lon],11);
        };
      });
  }

  $("drawer").classList.add("open");
}

function showMore(){
  $("drawerTitle").textContent="Settings";

  $("drawerBody").innerHTML=`
    <div class="setting">
      <div class="settingTitle">Location</div>
      <div class="settingText">
        ${escapeHtml(user.name||"Custom location")}<br>
        ${user.lat.toFixed(5)}, ${user.lng.toFixed(5)}
      </div>
      <button id="settingsLocation" class="action secondary">
        Choose location
      </button>
    </div>

    <div class="setting">
      <div class="settingTitle">Focus mode</div>
      <div class="settingText">
        Only show aircraft inside the selected radius.
      </div>
      <div id="settingsFocus" class="toggle ${focusMode?"on":""}"></div>
    </div>

    <div class="setting">
      <div class="settingTitle">3D mode</div>
      <div class="settingText">
        Experimental altitude visualization.
      </div>
      <div id="settings3d" class="toggle ${threeMode?"on":""}"></div>
    </div>

    <div class="setting">
      <div class="settingTitle">Data source</div>
      <div class="settingText">
        SkyTrack automatically tries multiple public ADS-B
        data endpoints and CORS relays.
      </div>
    </div>

    <div class="setting">
      <div class="settingTitle">Map</div>
      <div class="settingText">
        Tiles © Esri — Esri, HERE, Garmin,
        © OpenStreetMap contributors.
      </div>
    </div>

    <div class="setting">
      <div class="settingTitle">Storage</div>
      <div class="settingText">

  `;

  $("settingsLocation").onclick=()=>{

  $("settingsFocus").onclick=()=>{

  $("settings3d").onclick=()=>{
    threeMode=!threeMode;

    $("threeBtn").classList.toggle("active",threeMode);
    $("map").style.display=threeMode?"none":"block";
    $("scene3d").classList.toggle("active",threeMode);
    $("radiusPanel").style.display=threeMode?"none":"block";

    showMore();
    render3D(visibleAircraft());
  };

  $("drawer").classList.add("open");
}

/* =========================================================
   BOOKMARK SYNC / HISTORY
   ========================================================= */

function syncBookmarks(){
  if(!bookmarks.length) return;

  for(const a of aircraft){
    const id=flightId(a);
    if(!id) continue;

    const b=bookmarks.find(x=>x.id===id);
    if(!b) continue;

    b.callsign=callsign(a)||b.callsign;
    b.registration=a.r||b.registration;
    b.type=a.t||b.type;
    b.lastSeen=Date.now();

    b.history=b.history||[];

    const last=b.history[b.history.length-1];

    const now=Date.now();

    if(
      !last ||
      now-last.timestamp>30*60*1000 ||
      Math.abs((last.lat||0)-a.lat)>.02 ||
      Math.abs((last.lon||0)-a.lon)>.02
    ){
      b.history.push({
        timestamp:now,
        lat:a.lat,
        lon:a.lon,
        altitude:altNum(a.alt_baro),
        speed:speedNum(a),
        heading:headingNum(a)
      });

      if(b.history.length>500){
        b.history=b.history.slice(-500);
      }
    }
  }

  saveBookmarks();
}

/* =========================================================
   STATUS
   ========================================================= */

let statusTimer=null;

function setStatus(message,error=false){
  clearTimeout(statusTimer);

  const el=$("status");

  if(!message){
    el.classList.remove("show","error");
    return;
  }

  el.textContent=message;
  el.classList.toggle("error",error);
  el.classList.add("show");

  if(!error){
    statusTimer=setTimeout(()=>{
      el.classList.remove("show");
    },4000);
  }
}

/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================================================
   INITIALISE
   ========================================================= */

updateLocationGraphics();

map.on("moveend",()=>{
  if(locationPickerActive){
    $("locationPicker").dataset.lat=map.getCenter().lat;
    $("locationPicker").dataset.lng=map.getCenter().lng;
  }
});

map.on("click",()=>{
  if(locationPickerActive){
    $("locationPicker").dataset.lat=map.getCenter().lat;
    $("locationPicker").dataset.lng=map.getCenter().lng;
  }
});

/*
  First load + automatic refresh every 20 seconds.
*/
fetchAircraft();

refreshTimer=setInterval(()=>{
  fetchAircraft();
},20000);

/*
  Re-render after browser orientation / resize.
*/
window.addEventListener("resize",()=>{
  map.invalidateSize();
  render3D(visibleAircraft());
});
