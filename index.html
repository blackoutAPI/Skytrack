<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>SkyTrack — Live Airspace</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#050b14;--panel:rgba(7,17,31,.78);--panel2:rgba(12,27,46,.86);
  --line:rgba(155,195,235,.16);--text:#f5f8fc;--muted:#93a5ba;
  --blue:#1597ff;--blue2:#56b7ff;--green:#43e39a;--yellow:#ffd34e;
  --shadow:0 20px 60px rgba(0,0,0,.42);--radius:22px;
}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}
#app{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 10%,#102744 0,#07111f 38%,#03070d 100%)}
#map{position:absolute;inset:0;background:#1b1f24}
.leaflet-control-attribution{background:rgba(0,0,0,.48)!important;color:#b9c8d8!important;font-size:9px}
.leaflet-control-attribution a{color:#b9c8d8!important}
.leaflet-control-zoom{display:none}
.topbar{position:absolute;z-index:900;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:17px;
background:rgba(5,12,23,.76);backdrop-filter:blur(22px);box-shadow:var(--shadow)}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,#54baff,#087af4);
display:grid;place-items:center;box-shadow:0 8px 24px #087af444}
.logo span{font-size:17px;transform:rotate(-12deg)}
.brand b{font-size:14px;letter-spacing:-.2px}.brand small{display:block;color:#8fa4ba;font-size:9px;margin-top:1px}
.search{flex:1;max-width:430px;display:flex;align-items:center;gap:8px;background:rgba(5,12,23,.76);
border:1px solid var(--line);border-radius:17px;padding:0 13px;height:49px;backdrop-filter:blur(22px)}
.search input{background:none;border:0;outline:0;width:100%;font-size:13px}.search input::placeholder{color:#72869d}
.iconbtn{width:45px;height:45px;border-radius:15px;background:rgba(5,12,23,.76);border:1px solid var(--line);
backdrop-filter:blur(22px);display:grid;place-items:center;font-size:19px}
.mapstack{position:absolute;z-index:900;right:16px;top:86px;display:grid;gap:8px}
 closeLocationPicker();document.getElementById('loading').classList.add('show');fetchAircraft();
}
function confirmLocation(){const c=map.getCenter();setLocation(c.lat,c.lng,'Custom location')}
function useGps(){
 if(!navigator.geolocation){toast('GPS not available in this browser');return}
 toast('Requesting GPS…');
 navigator.geolocation.getCurrentPosition(p=>{setLocation(p.coords.latitude,p.coords.longitude,'My location');map.setView([p.coords.latitude,p.coords.longitude],9)},
  ()=>toast('GPS blocked here. Drag the map instead'),{timeout:8000,maximumAge:60000});
}

/* ---------- wiring ---------- */
document.getElementById('radius').oninput=e=>{radius=+e.target.value;document.getElementById('radiusText').textContent=radius;document.getElementById('radiusOut').textContent=radius+' km';redraw();clearTimeout(timer);timer=setTimeout(fetchAircraft,600)}
document.getElementById('focusToggle').onclick=()=>setFocus(!focus)
document.getElementById('threeToggle').onclick=()=>set3D(!is3D)
document.getElementById('refreshBtn').onclick=()=>{document.getElementById('loading').classList.add('show');fetchAircraft()}
document.getElementById('locBtn').onclick=openLocationPicker
document.getElementById('pickerCancel').onclick=closeLocationPicker
document.getElementById('pickerConfirm').onclick=confirmLocation
document.getElementById('pickerGps').onclick=useGps
document.getElementById('closeDrawer').onclick=closeDrawer
document.getElementById('navMap').onclick=closeDrawer
document.getElementById('navBookmarks').onclick=renderBookmarks
document.getElementById('navFlights').onclick=renderFlights
document.getElementById('navSettings').onclick=renderSettings
document.querySelectorAll('.modebar button').forEach(b=>b.onclick=()=>{perspective=b.dataset.mode==='perspective';document.querySelectorAll('.modebar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('.ground').style.transform=perspective?'perspective(700px) rotateX(58deg)':'rotateX(58deg)'});
document.getElementById('search').oninput=e=>{searchQ=e.target.value.trim().toUpperCase();redraw()}
map.on('click',e=>{ if(pickerActive){ map.setView(e.latlng,map.getZoom(),{animate:true}); return; } if(document.getElementById('drawer').classList.contains('open'))closeDrawer(); });

document.getElementById('loading').classList.add('show');
redraw();
fetchAircraft();
scheduleRefresh();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){inFlight=false;fetchAircraft()}});
window.addEventListener('pageshow',ev=>{if(ev.persisted){inFlight=false;fetchAircraft()}});
</script>
</body>
</html>
